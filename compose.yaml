name: sih
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ayurip
      POSTGRES_USER: ayurip
      POSTGRES_PASSWORD: ${AYURIP_DB_PASSWORD:?Set AYURIP_DB_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ayurip -d ayurip"]
      interval: 5s
      timeout: 5s
      retries: 12
  api:
    build: .
    command: ["uvicorn", "ipindia_corpus.search_api:app", "--host", "0.0.0.0", "--port", "8000", "--no-proxy-headers"]
    environment:
      DATABASE_URL: postgresql://ayurip:${AYURIP_DB_PASSWORD}@db:5432/ayurip
      AYURIP_CONTACT: ${AYURIP_CONTACT:-}
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
  scheduler:
    build: .
    command: ["python", "-m", "ipindia_corpus.sync_runner", "schedule"]
    environment:
      DATABASE_URL: postgresql://ayurip:${AYURIP_DB_PASSWORD}@db:5432/ayurip
      AYURIP_CONTACT: ${AYURIP_CONTACT:-}
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
    profiles: ["sync"]
  candidate-worker:
    image: sih-api
    build: .
    command: ["python", "-m", "ipindia_corpus.candidate_sync", "schedule", "--poll-seconds", "300"]
    environment:
      DATABASE_URL: postgresql://ayurip:${AYURIP_DB_PASSWORD}@db:5432/ayurip
      AYURIP_CONTACT: ${AYURIP_CONTACT:-}
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
    profiles: ["candidate"]
    restart: unless-stopped
volumes:
  pgdata:
